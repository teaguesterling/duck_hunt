#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose: without it a push and a
  # workflow_dispatch on the same branch share ref+sha (both with empty
  # head_ref/base_ref), land in one group, and cancel-in-progress kills the push
  # run whenever the canary is hand-dispatched — a cancelled run then reads as a
  # FAILED check on the PR dashboard (phantom red).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat canary built against duckdb `main`. EXPECTED to go red on
  # upstream API drift (e.g. CreateMacroInfo::schema/name) — this leg is NOT a
  # merge blocker. Windows stays excluded here (main's fmt/MSVC state is not the
  # gate); the merge gate lives on the stable leg below.
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duck_hunt
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  # Real v2.0 leg (distinct from the advisory main canary above). This builds the
  # line the community registry actually ships as the prerelease (build_next.yml =
  # v2.0-cyanoptera), and unlike the main canary its `if:` INCLUDES pull_request, so
  # it GATES PRs -- the family-C shim's #if branch is built and tested here, in-flight,
  # rather than only at descriptor-repoint time in the registry. One arch on purpose:
  # "does this build and test on the v2.0 line" is arch-independent, and each extra arch
  # is another from-source vcpkg build, so the rest are excluded to keep the loop fast.
  # (linux_amd64 only also sidesteps the MSVC std::regex complexity cap that keeps the
  # stable leg's windows excluded.)
  duckdb-cyanoptera-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: duck_hunt
      # osx_arm64 is INCLUDED (not in the exclude list) on purpose: a v2.0 x macOS
      # behavioural regression (missing-file tolerance throwing IO Error on the
      # v2.0/macOS build -- a narrow catch(const IOException&) that missed the open
      # exception there; exact mechanism not isolated) was invisible to a Linux-only
      # leg and only caught at registry descriptor time. Testing v2.0 on osx_arm64
      # here gates that class in-flight. Rest excluded to keep it a build-AND-test
      # smoke of the v2.0 line, not a full matrix.
      #
      # reduced_ci_mode: 'disabled' is LOAD-BEARING, not cosmetic. The default
      # ('auto') enables reduced CI on pull_request, which drops EVERY non-Linux arch
      # from the generated matrix regardless of exclude_archs -- so on PRs (the event
      # this leg's `if:` is meant to gate) the osx_arm64 above would silently vanish
      # and the leg would be Linux-only. 'disabled' builds the full declared matrix on
      # every event, and also sets fail-fast:false so one arch's failure doesn't cancel
      # the others.
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      reduced_ci_mode: 'disabled'
      vcpkg_binary_sources: 'clear'

  # Drift guard: make the "no v2.0 leg" gap unrepresentable rather than merely fixed.
  # If someone deletes the cyanoptera leg or edits the version constants, this fails
  # loudly. Scoped to THIS workflow file only (bracketed/quoted duckdb_version styles
  # in other workflow files would make an anchored grep error for the wrong reason).
  version-drift-guard:
    name: DuckDB version drift guard
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.6
      DUCKDB_NEXT: v2.0-cyanoptera
    steps:
      - uses: actions/checkout@v4
      - name: Assert both the stable and v2.0 lines are built
        run: |
          wf=.github/workflows/MainDistributionPipeline.yml
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" "$wf" || true)
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" "$wf" || true)
          [ "$n" -ge 1 ] || { echo "::error::no job builds the stable line duckdb_version: ${DUCKDB_VERSION}"; exit 1; }
          [ "$m" -ge 1 ] || { echo "::error::no job builds the v2.0 line duckdb_version: ${DUCKDB_NEXT} (cyanoptera leg missing/renamed?)"; exit 1; }
          echo "drift guard OK: stable=${DUCKDB_VERSION} (${n} job(s)), next=${DUCKDB_NEXT} (${m} job(s))"

  # Stable/default build, tracks the v1.5-variegata submodule pin. THIS is the
  # merge gate. Windows excluded again: the build itself is fine now (variegata
  # vendors a fmt without the removed MSVC stdext::checked_array_iterator), but
  # MSVC's std::regex enforces a match-complexity cap that libstdc++/libc++ do
  # not, and three parser tests (config_parser, format_groups, sample_files)
  # fail with regex_error(error_complexity). Re-enable once those parsers'
  # patterns are simplified below MSVC's cap or moved off std::regex.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: duck_hunt
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: duck_hunt
      format_checks: 'format'

  # Guards the WASM build against unresolved dependency symbols (the LINKED_LIBS
  # class of bug: duckdb_yaml #40 / duckdb_webbed #96). The reusable distribution
  # workflow builds and uploads the .wasm but never inspects or loads it, so a
  # side module with unresolved imports would ship green. This downloads the
  # built v1.5-variegata wasm artifacts and runs two layers (see test/wasm/):
  #   Layer 1 (hard gate)  — static check that every not-self-resolved symbol is
  #                          host-provided. duck_hunt links no vcpkg deps, so the
  #                          expected result is "0 foreign"; needs only node.
  #   Layer 2 (non-blocking) — live INSTALL/LOAD + query in a duckdb-wasm engine.
  #                          Informational until a public engine ships v1.5-variegata with
  #                          the pinned emsdk ABI (today's engines fail on
  #                          version/toolchain skew, downstream of symbol resolution).
  wasm-symbol-check:
    name: WASM symbol resolution check
    needs: [duckdb-stable-build]
    # Run as long as the build wasn't cancelled, even if an unrelated platform
    # leg of the stable build failed: the wasm artifacts build independently,
    # so the guard should still inspect them. If they're genuinely missing, the
    # download step fails and this job fails (correctly).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: duck_hunt-v1.5.6-extension-wasm_*
          path: wasm-artifacts
      - name: Layer 1 — static symbol check (no symbol may be unresolved)
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts
      - name: Layer 2 — live load test in duckdb-wasm (informational until official v1.5-variegata)
        continue-on-error: true
        # continue-on-error alone is NOT enough: a hung step runs to the job
        # limit and gets *cancelled*, and cancellation overrides
        # continue-on-error (failing the job). So hard-cap the step and time-box
        # each command (npm install + the node load can both hang on a mismatched
        # engine). The in-script watchdog in load_test.cjs is the inner backstop.
        # (Lesson from duckdb_webbed 6f2a274.)
        timeout-minutes: 10
        working-directory: test/wasm
        run: |
          set -uo pipefail
          timeout 300 npm install --no-save
          mkdir -p repo/v1.5.6/wasm_eh
          cp "$GITHUB_WORKSPACE/wasm-artifacts/duck_hunt-v1.5.6-extension-wasm_eh/duck_hunt.duckdb_extension.wasm" \
             repo/v1.5.6/wasm_eh/
          timeout 240 node load_test.cjs --repo repo --name duck_hunt --platform eh \
            --query "SELECT duck_hunt_detect_format('{\"tests\":[{\"nodeid\":\"a::b\",\"outcome\":\"failed\"}]}') AS fmt" \
            --expect '"fmt":"pytest_json"'
